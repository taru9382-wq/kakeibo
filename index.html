<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Budget</title>

  <!-- アプリアイコン設定 -->
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px 20px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 35px 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 320px; margin: 0 auto; }
    .label { font-size: 14px; color: #777; font-weight: 600; letter-spacing: 1px; }
    .balance { font-size: 44px; font-weight: 800; color: #2e7d32; margin: 20px 0; }
    input { width: 85%; padding: 14px; font-size: 18px; border: 2px solid #e0e0e0; border-radius: 12px; text-align: center; margin-bottom: 20px; outline: none; box-sizing: border-box; }
    input:focus { border-color: #1e88e5; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    .btn-sub { background: #e53935; color: white; }
    .btn-add { background: #1e88e5; color: white; }
    .error-msg { color: #e53935; font-size: 12px; margin-top: 15px; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <div class="label">今使えるお金</div>
  <div class="balance" id="balanceDisplay">--- 円</div>

  <input type="number" id="amountInput" placeholder="金額を入力 (円)" inputmode="numeric">

  <div class="btn-group">
    <button class="btn-sub" onclick="updateBalance(-1)">使った（引く）</button>
    <button class="btn-add" onclick="updateBalance(1)">追加（足す）</button>
  </div>
  <div class="error-msg" id="errorDisplay"></div>
</div>

<script>
  // 最新の Cloudflare URL
  const API_BASE_URL = "https://liberty-utilize-handling-accommodation.trycloudflare.com"; 

  // 残高を取得する処理
  async function fetchBalance() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/balance`);
      if (!res.ok) throw new Error(`HTTPエラー: ${res.status}`);
      const data = await res.json();
      
      if (data.error) {
        document.getElementById('balanceDisplay').innerText = "エラー";
        document.getElementById('errorDisplay').innerText = data.error;
        return;
      }

      document.getElementById('balanceDisplay').innerText = `${data.balance.toLocaleString()} 円`;
      document.getElementById('errorDisplay').innerText = "";
    } catch (e) {
      document.getElementById('balanceDisplay').innerText = "エラー";
      document.getElementById('errorDisplay').innerText = e.message;
    }
  }

  // 残高を更新（加算・減算）する処理
  async function updateBalance(sign) {
    const input = document.getElementById('amountInput');
    const val = parseInt(input.value);
    if (!val || val <= 0) return;

    const amount = val * sign;
    try {
      const res = await fetch(`${API_BASE_URL}/api/balance/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: amount })
      });
      if (!res.ok) throw new Error(`更新エラー: ${res.status}`);
      const data = await res.json();
      
      if (data.status === "error") {
        document.getElementById('errorDisplay').innerText = data.message;
        return;
      }

      document.getElementById('balanceDisplay').innerText = `${data.balance.toLocaleString()} 円`;
      input.value = '';
      document.getElementById('errorDisplay').innerText = "";
    } catch (e) {
      document.getElementById('errorDisplay').innerText = e.message;
    }
  }

  // 画面を開いた時に残高を読み込む
  fetchBalance();
</script>

</body>
</html>
